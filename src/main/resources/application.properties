spring.application.name=proposta-app
spring.datasource.url=jdbc:postgresql://localhost:5433/proposta
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Publisher confirms: o broker confirma (ack/nack) cada mensagem publicada
spring.rabbitmq.publisher-confirm-type=correlated
# Publisher returns: o broker devolve mensagens que não chegaram a nenhuma fila
spring.rabbitmq.publisher-returns=true
# Tempo máximo para aguardar a confirmação do broker
rabbitmq.publisher-confirm.timeout-ms=5000

rabbitmq.propostapendente.exchange=proposta-pendente.ex
rabbitmq.propostaconcluida.exchange=proposta-concluida.ex

